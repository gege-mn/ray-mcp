name: Publish

# Runs when a GitHub release is published. Tag it vX.Y.Z after bumping the
# version in package.json, server.json (twice) and src/version.ts.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance and MCP Registry GitHub OIDC login

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No dependency cache in the release job (cache-poisoning hardening).

      - name: Check the release tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for v in "$(node -p "require('./package.json').version")" \
                   "$(node -p "require('./server.json').version")" \
                   "$(node -p "require('./server.json').packages[0].version")"; do
            if [ "$v" != "$TAG" ]; then
              echo "::error::release tag v$TAG does not match version $v in package.json/server.json"
              exit 1
            fi
          done

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run smoke

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Wait for the npm registry to serve the new version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 30); do
            if [ "$(npm view "@gege-mn/ray-mcp@$VERSION" mcpName 2>/dev/null)" = "io.github.gege-mn/ray-mcp" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::@gege-mn/ray-mcp@$VERSION did not appear on npm in time"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Log in to the MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
